name: Publish to PyPI

on:
  push:
    tags:
      - "pypi-v[0-9]*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release promotion
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^pypi-v[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]]; then
            echo "Unexpected tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          RELEASE_TAG="${GITHUB_REF_NAME#pypi-}"
          VERSION="${GITHUB_REF_NAME#pypi-v}"

          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"

          if [ "${CHECKED_OUT_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "Checked-out commit does not match GITHUB_SHA." >&2
            echo "Checked out: ${CHECKED_OUT_COMMIT}" >&2
            echo "Event SHA:   ${GITHUB_SHA}" >&2
            exit 1
          fi

          if ! git rev-parse --verify \
            "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "Original release tag is missing: ${RELEASE_TAG}" >&2
            exit 1
          fi

          RELEASE_COMMIT="$(
            git rev-parse "refs/tags/${RELEASE_TAG}^{commit}"
          )"

          PROMOTION_COMMIT="$(
            git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}"
          )"

          if [ "${RELEASE_COMMIT}" != "${PROMOTION_COMMIT}" ]; then
            echo "Release and promotion tags identify different commits." >&2
            echo "Release:   ${RELEASE_COMMIT}" >&2
            echo "Promotion: ${PROMOTION_COMMIT}" >&2
            exit 1
          fi

          if [ "${PROMOTION_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "Promotion tag does not identify GITHUB_SHA." >&2
            exit 1
          fi

          echo "release-tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${RELEASE_TAG}"
          echo "Package version: ${VERSION}"
          echo "Commit: ${PROMOTION_COMMIT}"

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: 0.83.0
          environments: build
          frozen: true
          cache: true

      - name: Build Python distributions
        shell: bash
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XNFT_LEMMA_SCANNER: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          pixi run --frozen -e build build-dist

      - name: Validate Python distributions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          WHEEL_COUNT="$(
            find dist -maxdepth 1 -type f -name '*.whl' |
              wc -l |
              tr -d ' '
          )"

          SDIST_COUNT="$(
            find dist -maxdepth 1 -type f -name '*.tar.gz' |
              wc -l |
              tr -d ' '
          )"

          if [ "${WHEEL_COUNT}" -ne 1 ]; then
            echo "Expected one wheel; found ${WHEEL_COUNT}." >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

          if [ "${SDIST_COUNT}" -ne 1 ]; then
            echo "Expected one sdist; found ${SDIST_COUNT}." >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi

          pixi run --frozen -e build python -m twine check \
            dist/*.whl \
            dist/*.tar.gz

          pixi run --frozen -e build python - <<'PY'
          import os
          from pathlib import Path

          from packaging.utils import (
              canonicalize_version,
              parse_sdist_filename,
              parse_wheel_filename,
          )

          expected = canonicalize_version(os.environ["EXPECTED_VERSION"])

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))

          _, wheel_version, _, _ = parse_wheel_filename(wheels[0].name)
          _, sdist_version = parse_sdist_filename(sdists[0].name)

          if canonicalize_version(wheel_version) != expected:
              raise SystemExit(
                  f"Wheel version {wheel_version} does not match {expected}"
              )

          if canonicalize_version(sdist_version) != expected:
              raise SystemExit(
                  f"Sdist version {sdist_version} does not match {expected}"
              )

          print(f"Validated wheel and sdist version: {expected}")
          PY

          sha256sum dist/*.whl dist/*.tar.gz

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    needs:
      - build

    environment:
      name: pypi
      url: https://pypi.org/project/xnft-lemma-scanner/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
