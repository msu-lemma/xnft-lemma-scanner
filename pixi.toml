[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = [
    { platform = "osx-arm64", macos = "15.0" },
    { platform = "osx-64", macos = "15.0" },
    { platform = "linux-64" },                  # glibc = "2.35" },
    { platform = "linux-aarch64" },             # glibc = "2.35" },
    { platform = "win-64" },
]
preview = ["pixi-build"]
exclude-newer = "7d" # Wait two weeks before using new packages

[workspace.dependencies]
python = ">=3.12,<3.15"

[package]
name = "xnft-lemma-scanner"
version = "0.0.0.dev0"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]


[package.build-dependencies]
git = ">=2.53.0,<3"

[package.host-dependencies]
python = { workspace = true }
hatchling = ">=1.32.4,<2"
hatch-vcs = ">=0.5.0,<0.6"

[package.run-dependencies]
# xnft = { path = "../xnft" }

[environments]
build = ["build"]
test = ["test"]
dev = ["test", "dev"]

# Python version testing environments
test-py312 = ["test", "py312"]
test-py313 = ["test", "py313"]
test-py314 = ["test", "py314"]
# test-py315 = ["test", "py315"]

[tasks]

[feature.test.tasks]

test = "pytest -s"

[feature.build.tasks.build-dist]
cmd = ["uv", "build", "--sdist", "--wheel", "--no-sources"]

[dependencies]
xnft-lemma-scanner = { path = "." }

[feature.dev.dependencies]
ty = ">=0.0.87,<0.0.88"
pre-commit = ">=4.7.0,<5"

[feature.build.dependencies]
uv = ">=0.13.1,<0.14"
glab = ">=1.123.0,<2"
hatchling = ">=1.32.4,<2"
hatch-vcs = ">=0.5.0,<0.6"
twine = ">=7.0.0,<8"

[feature.test.dependencies]
xnft = { git = "https://www.gitlab.msu.edu/ece-lemma/public/xnft/xnft.git", rev = 'main' }
ruff = ">=0.17.0,<0.18"
pytest = ">=9.1.1,<10"
pytest-xdist = ">=3.8.0,<4"
pytest-cov = ">=7.1.0,<8"
# h5py = ">=3.16.0,<4"
# numpy = ">=2.5.4,<3"
# xarray = ">=2026.9.0,<2027"

[feature.py312.dependencies]
python = "3.12.*"
"backports.zstd" = ">=1.8.0,<2"

[feature.py313.dependencies]
python = "3.13*"
"backports.zstd" = ">=1.8.0,<2"

[feature.py314.dependencies]
python = "3.14.*"

# [feature.py315.dependencies]
# python = "3.15.*"
