[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = [
    { platform = "osx-arm64", macos = "15.0" },
    { platform = "osx-64", macos = "15.0" },
    { platform = "linux-64" },                  # glibc = "2.35" },
    { platform = "linux-aarch64" },             # glibc = "2.35" },
    { platform = "win-64" },
]
preview = ["pixi-build"]
exclude-newer = "14d" # Wait two weeks before using new packages

[workspace.dependencies]
python = ">=3.12,<3.15"

[package]
name = "xnft-lemma-scanner"
version = "0.0.0.dev0"

[package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]


[package.build-dependencies]
git = ">=2.53.0,<3"

[package.host-dependencies]
python = { workspace = true }
hatchling = ">=1.32.4,<2"
hatch-vcs = ">=0.5.0,<0.6"

[package.run-dependencies]
# xnft = { path = "../xnft" }

[environments]
build = ["build"]
test = ["test"]

[tasks]

[feature.build.tasks.build-wheel]
cmd = ["uv", "build"]

[dependencies]
xnft-lemma-scanner = { path = "." }


[feature.build.dependencies]
uv = ">=0.13.1,<0.14"
glab = ">=1.123.0,<2"
hatchling = ">=1.32.4,<2"
hatch-vcs = ">=0.5.0,<0.6"
twine = ">=7.0.0,<8"


[feature.test.dependencies]
# pytest = ">=9.1.1,<10"
# pytest-cov = ">=7.1.0,<8"
# pytest-xdist = ">=3.8.0,<4"
# types-pyyaml = ">=6.0.12.20260906,<7"
ruff = ">=0.17.0,<0.18"
# pytest-qt = ">=4.5.0,<5"
