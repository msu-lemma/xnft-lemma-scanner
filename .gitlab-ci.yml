stages:
  - pixi-cache
  - build-test
  - package
  - release
  - promote-pypi

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

  # PyPI tags are added to trigger a PyPI upload job on GitHub.
  # Do not start another GitLab pipeline for these promotion tags.
  rules:
    - if: "$CI_COMMIT_TAG =~ /^pypi-v/"
      when: never
    - when: always

default:
  interruptible: true

variables:
  DEBIAN_FRONTEND: "noninteractive"
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.pixi-cache"
  QT_QPA_PLATFORM: "offscreen"

  # FF_USE_FASTZIP: "true"
  # CACHE_COMPRESSION_LEVEL: "fastest"

.test-rules:
  rules: &test-rules
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - pixi.toml
        - pixi.lock
    - when: never

.package-rules:
  rules: &package-rules
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

.release-rules:
  rules: &release-rules
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(a\d+|b\d+|rc\d+)?$/'
    - when: never

.pixi-cache: &pixi-cache
  key:
    files:
      - pixi.lock
  paths:
    - .pixi-cache/
  policy: pull

prepare-pixi-cache:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: pixi-cache

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git git-lfs

  cache:
    <<: *pixi-cache
    policy: pull-push

  script:
    - pixi install -e test-py312
    - pixi install -e test-py313
    - pixi install -e test-py314

# Run test cases for all supported python versions
test:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test

  rules: *test-rules

  variables:
    GIT_SUBMODULE_STRATEGY: normal
    # GIT_SUBMODULE_PATHS: "data"
    GIT_SUBMODULE_DEPTH: "1"
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    GIT_LFS_SKIP_SMUDGE: "1"
    PYTHON_CPU_COUNT: "16" # limit resources on large CPU clusters

  parallel:
    matrix:
      - PIXI_ENVIRONMENT:
          - test-py312
          - test-py313
          - test-py314

  cache:
    <<: *pixi-cache

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git git-lfs
    - git -C data lfs pull

  script:
    - pixi run -e "${PIXI_ENVIRONMENT}" python --version
    # - pixi run -e "${PIXI_ENVIRONMENT}" pytest -s -n 16 -vv -rA

  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

code-quality:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: build-test

  rules: *test-rules

  cache:
    <<: *pixi-cache

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git git-lfs

  script:
    - >
      pixi run -e test ruff check
      --output-format=gitlab
      --output-file="${CI_PROJECT_DIR}/code-quality-report.json"

  artifacts:
    when: always
    reports:
      codequality: "${CI_PROJECT_DIR}/code-quality-report.json"

