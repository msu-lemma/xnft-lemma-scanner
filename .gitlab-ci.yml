package-python:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: package

  rules: *package-rules

  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"

  cache:
    <<: *pixi-cache

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git git-lfs
    - git fetch --force --tags
    - git describe --tags --always --dirty

  script:
    - |
      set -eu

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        PACKAGE_VERSION="${CI_COMMIT_TAG#v}"

        echo "Building Python release version ${PACKAGE_VERSION}"

        # The normalized distribution name for xnft-lemma-scanner is
        # XNFT_LEMMA_SCANNER.
        export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XNFT_LEMMA_SCANNER="${PACKAGE_VERSION}"
      else
        echo "Building Python development version from VCS metadata"
      fi

      pixi run --frozen -e build build-dist

      WHEEL_FILE="$(
        find dist \
          -maxdepth 1 \
          -type f \
          -name '*.whl' \
          -printf '%f\n' \
          -quit
      )"

      SDIST_FILE="$(
        find dist \
          -maxdepth 1 \
          -type f \
          -name '*.tar.gz' \
          -printf '%f\n' \
          -quit
      )"

      if [ -z "${WHEEL_FILE}" ]; then
        echo "ERROR: No wheel was created." >&2
        exit 1
      fi

      if [ -z "${SDIST_FILE}" ]; then
        echo "ERROR: No source distribution was created." >&2
        exit 1
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        case "${WHEEL_FILE}" in
          *-"${PACKAGE_VERSION}"-*)
            ;;
          *)
            echo "ERROR: Wheel does not use version ${PACKAGE_VERSION}." >&2
            echo "Wheel: ${WHEEL_FILE}" >&2
            exit 1
            ;;
        esac

        case "${SDIST_FILE}" in
          *-"${PACKAGE_VERSION}".tar.gz)
            ;;
          *)
            echo "ERROR: Source distribution does not use version ${PACKAGE_VERSION}." >&2
            echo "Source distribution: ${SDIST_FILE}" >&2
            exit 1
            ;;
        esac
      fi

      printf 'WHEEL_FILE=%s\n' "${WHEEL_FILE}" > python-package.env
      printf 'SDIST_FILE=%s\n' "${SDIST_FILE}" >> python-package.env

      echo "Created ${WHEEL_FILE}"
      echo "Created ${SDIST_FILE}"

  artifacts:
    expire_in: 30 days
    paths:
      - "dist/*.whl"
      - "dist/*.tar.gz"
    reports:
      dotenv: python-package.env

package-conda:
  image: ghcr.io/prefix-dev/pixi:latest
  stage: package

  rules: *package-rules

  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"

  cache:
    <<: *pixi-cache

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git git-lfs
    - git fetch --force --tags
    - git describe --tags --always --dirty

  script:
    - |
      set -eu

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        PACKAGE_VERSION="${CI_COMMIT_TAG#v}"

        echo "Building Conda release version ${PACKAGE_VERSION}"
      else
        PACKAGE_VERSION="$(
          pixi run -e build python -c \
            'from setuptools_scm import get_version; print(get_version())'
        )"

        echo "Building Conda development version ${PACKAGE_VERSION}"
      fi

      if [ -z "${PACKAGE_VERSION}" ]; then
        echo "ERROR: The package version is empty." >&2
        exit 1
      fi

      sed -i \
        "/^\[package\]$/,/^\[/ s/^version = \".*\"/version = \"${PACKAGE_VERSION}\"/" \
        pixi.toml

      if ! grep -q "^version = \"${PACKAGE_VERSION}\"$" pixi.toml; then
        echo "ERROR: Failed to set pixi.toml version to ${PACKAGE_VERSION}." >&2
        exit 1
      fi

      # Ensure that any Python distribution built internally by the Pixi
      # backend uses the same version.
      export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XNFT_LEMMA_SCANNER="${PACKAGE_VERSION}"

      pixi publish --target-dir=dist

      CONDA_FILE="$(
        find dist \
          -maxdepth 1 \
          -type f \
          -name '*.conda' \
          -printf '%f\n' \
          -quit
      )"

      if [ -z "${CONDA_FILE}" ]; then
        echo "ERROR: No Conda package was created." >&2
        exit 1
      fi

      case "${CONDA_FILE}" in
        *-"${PACKAGE_VERSION}"-*)
          ;;
        *)
          echo "ERROR: Conda package does not use version ${PACKAGE_VERSION}." >&2
          echo "Conda package: ${CONDA_FILE}" >&2
          exit 1
          ;;
      esac

      printf 'CONDA_FILE=%s\n' "${CONDA_FILE}" > conda-package.env
      printf 'PACKAGE_VERSION=%s\n' "${PACKAGE_VERSION}" >> conda-package.env

      echo "Created ${CONDA_FILE}"

  artifacts:
    expire_in: 30 days
    paths:
      - "dist/*.conda"
    reports:
      dotenv: conda-package.env

publish-pypi:
  interruptible: false
  stage: release
  image: ghcr.io/prefix-dev/pixi:latest

  variables:
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"

  needs:
    - job: test
    - job: package-python
      artifacts: true

  rules: *package-rules

  script:
    - |
      set -eu

      test -n "${WHEEL_FILE}"
      test -n "${SDIST_FILE}"
      test -r "dist/${WHEEL_FILE}"
      test -r "dist/${SDIST_FILE}"

      pixi run -e build python -m twine check \
        "dist/${WHEEL_FILE}" \
        "dist/${SDIST_FILE}"

      pixi run -e build python -m twine upload \
        --verbose \
        --skip-existing \
        --non-interactive \
        --repository-url \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
        "dist/${WHEEL_FILE}" \
        "dist/${SDIST_FILE}"

publish-conda-dev:
  interruptible: false
  stage: release
  image: alpine:3.22

  needs:
    - job: test
      optional: true
    - job: package-conda
      artifacts: true

  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never

  before_script:
    - apk add --no-cache curl

  script:
    - |
      set -eu

      test -n "${CONDA_FILE}"
      test -r "dist/${CONDA_FILE}"

      REGISTRY_VERSION="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"

      echo "Uploading ${CONDA_FILE}"
      echo "Package version: ${PACKAGE_VERSION}"
      echo "Registry version: ${REGISTRY_VERSION}"

      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${CONDA_FILE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}-dev-conda/${REGISTRY_VERSION}/${CONDA_FILE}"

publish-release-packages:
  interruptible: false
  stage: release
  image: alpine:3.22

  needs:
    - job: test
    - job: package-python
      artifacts: true
    - job: package-conda
      artifacts: true

  rules: *release-rules

  before_script:
    - apk add --no-cache curl

  script:
    - |
      set -eu

      for FILE_NAME in \
        "${CONDA_FILE}" \
        "${WHEEL_FILE}" \
        "${SDIST_FILE}"
      do
        if [ -z "${FILE_NAME}" ]; then
          echo "ERROR: A package filename is empty." >&2
          exit 1
        fi

        if [ ! -r "dist/${FILE_NAME}" ]; then
          echo "ERROR: Cannot read dist/${FILE_NAME}." >&2
          exit 1
        fi

        echo "Uploading ${FILE_NAME}"

        curl --fail-with-body \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "dist/${FILE_NAME}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${FILE_NAME}"
      done

release:
  interruptible: false
  stage: release
  image: alpine:3.22

  needs:
    - job: test
    - job: code-quality

    - job: package-python
      artifacts: true

    - job: package-conda
      artifacts: true

    - job: publish-pypi

    - job: publish-release-packages

  rules: *release-rules

  before_script:
    - apk add --no-cache curl

  script:
    - |
      set -eu

      RELEASE_API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      RELEASE_LINKS_API="${RELEASE_API}/${CI_COMMIT_TAG}/assets/links"
      PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}"

      echo "Creating release for ${CI_COMMIT_TAG}..."

      curl --fail-with-body \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "name=Release ${CI_COMMIT_TAG}" \
        --data-urlencode "description=Release created by pipeline ${CI_PIPELINE_URL}." \
        --data-urlencode "tag_name=${CI_COMMIT_TAG}" \
        --data-urlencode "ref=${CI_COMMIT_SHA}" \
        "${RELEASE_API}"

      for FILE_NAME in \
        "${CONDA_FILE}" \
        "${WHEEL_FILE}" \
        "${SDIST_FILE}"
      do
        if [ -z "${FILE_NAME}" ]; then
          echo "ERROR: A release package filename is empty." >&2
          exit 1
        fi

        echo "Adding release link for ${FILE_NAME}..."

        curl --fail-with-body \
          --request POST \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --data-urlencode "name=${FILE_NAME}" \
          --data-urlencode "url=${PACKAGE_BASE_URL}/${FILE_NAME}" \
          --data-urlencode "link_type=package" \
          "${RELEASE_LINKS_API}"
      done

# Create the PyPI promotion tag after a successful release
release-to-pypi:
  stage: promote-pypi
  image: alpine:3.22
  interruptible: false

  needs:
    - job: release

  rules: *release-rules

  before_script:
    - apk add --no-cache git
    - >
      git remote set-url origin
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

  script:
    - |
      set -eu

      PROMOTION_TAG="pypi-${CI_COMMIT_TAG}"

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"

      echo "Checking promotion tag ${PROMOTION_TAG}..."

      if git ls-remote --exit-code --tags origin \
        "refs/tags/${PROMOTION_TAG}" >/dev/null 2>&1
      then
        echo "Promotion tag ${PROMOTION_TAG} already exists remotely."
        exit 0
      fi

      # A tag can exist in the runner checkout even when it is not present
      # on the remote. Remove only the local copy before creating it.
      git tag --delete "${PROMOTION_TAG}" 2>/dev/null || true

      git tag \
        --annotate \
        --message "Promoted after successful pipeline ${CI_PIPELINE_ID}: ${CI_PIPELINE_URL}" \
        "${PROMOTION_TAG}" \
        "${CI_COMMIT_SHA}"

      git push origin "refs/tags/${PROMOTION_TAG}"
