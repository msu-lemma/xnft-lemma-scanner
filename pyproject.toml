[project]
name = "xnft-lemma-scanner"
dynamic = ["version"]
authors = [
  { name = "LEmmA Group, Michigan State University" },
  { name = "Jason Merlo", email = "merlojas@msu.edu" },
  { name = "Mauro Ettorre", email = "ettorre@msu.edu" },
]
maintainers = [{ name = "Jason Merlo", email = "merlojas@msu.edu" }]
readme = "README.md"
description = "Antenna measurement and analysis software."
license = "LicenseRef-Proprietary"

requires-python = ">=3.12,<3.15"

# [project.scripts]
# xnft = "xnft.gui.app:main"

[project.urls]


[build-system]
requires = ["hatchling>=1.32.4,<2", "hatch-vcs>=0.5.0,<0.6"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?:pypi-)?v(?P<version>.*)$"

[tool.hatch.build.targets.wheel]
packages = ["src/xnft_lemma_scanner"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/xnft_lemma_scanner",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
]
exclude = ["/tests", "/data", "/docs", "/.pixi", "/.pixi-cache"]

# === PyTest Configuration ===

[tool.pytest.ini_options]
addopts = "--cov='xnft' --cov-report term --cov-report xml:coverage.xml --junitxml report.xml -n auto"

[tool.coverage.run]
source = ["src"]
omit = ["**/.pixi/**", "**/tests/**"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
# Exclude CI pixi cache folder.
extend-exclude = [".pixi-cache"]


# === xNFT Plugin Configuration ===
[project.entry-points."xnft.plugins"]
example = "xnft_lemma_scanner.plugin"
